<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub PR fixture</title>
    <style>
      body { margin: 0; background: #f6f8fa; color: #1f2328; font: 14px Arial, sans-serif; }
      header { padding: 20px 24px; border-bottom: 1px solid #d0d7de; background: #fff; }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        max-width: 980px;
        margin: 24px auto;
        padding: 0 20px;
      }
      [data-component="SplitPageLayout.Header"] {
        grid-column: 1 / -1;
        min-height: 36px;
      }
      nav { display: flex; gap: 8px; margin-top: 20px; }
      button { padding: 6px 12px; }
    </style>
  </head>
  <body>
    <header>
      <strong>facebook / react</strong>
      <div data-component="PageHeader"><h1>Repository navigation</h1></div>
      <nav aria-label="Fixture navigation">
        <button id="same-pr" type="button">Same PR</button>
        <button id="next-pr" type="button">Next PR</button>
        <button id="repository" type="button">Repository</button>
        <button id="replace-header" type="button">Replace header</button>
        <button id="remove-toolbar" type="button">Remove toolbar</button>
      </nav>
    </header>
    <main id="diff-comparison-viewer-container">
      <header data-component="SplitPageLayout.Header">
        <div data-component="PageHeader">
          <h1>Pull request fixture</h1>
        </div>
      </header>
    </main>
    <script>
      const navigate = (path) => history.pushState({}, '', path);
      document.querySelector('#same-pr').addEventListener('click', () => {
        navigate('/facebook/react/pull/42/files');
      });
      document.querySelector('#next-pr').addEventListener('click', () => {
        navigate('/facebook/react/pull/43');
      });
      document.querySelector('#repository').addEventListener('click', () => {
        navigate('/facebook/react');
      });
      document.querySelector('#replace-header').addEventListener('click', () => {
        const currentHeader = document.querySelector('[data-component="SplitPageLayout.Header"]');
        const nextHeader = currentHeader.cloneNode(true);
        currentHeader.replaceWith(nextHeader);
      });
      document.querySelector('#remove-toolbar').addEventListener('click', () => {
        document.querySelector('mergelens-pr-toolbar')?.remove();
      });
    </script>
  </body>
</html>
